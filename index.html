<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 수업 앱</title>
<style>
  :root {
    --bg: #f7f9fc;
    --ink: #0f172a;
    --dim: #64748b;
    --accent: #2563eb;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hint {
    margin: 0 0 26px;
    font-size: 15px;
    color: var(--dim);
  }

  /* 대단원 제목 — 아래 카드 묶음을 가른다 */
  h2 {
    margin: 30px 0 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h2:first-of-type { margin-top: 0; }

  /* 앱 카드 목록 — 앱이 늘어나면 카드가 자동으로 줄을 바꾼다 */
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .app {
    display: block;
    padding: 20px 20px 22px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    text-decoration: none;
    color: inherit;
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .app:hover  { box-shadow: 0 3px 10px rgba(15, 23, 42, .14); }
  .app:active { transform: scale(.98); }
  .app:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app .unit {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .app .name {
    display: block;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.35;
  }
  /* 아이콘은 이모지 대신 직접 그린 그림(SVG)을 쓴다. 이모지는 기기마다
     모양이 다르고 어떤 기기에서는 색 없는 검은 글자로 나온다.
     장식이므로 보조기기에는 숨긴다(aria-hidden) */
  .app .icon {
    display: block;
    margin-bottom: 10px;
    width: 30px;
    height: 30px;
    color: var(--accent);
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>정보 수업 앱</h1>
    <p class="hint">선생님이 안내한 앱을 누르세요.</p>

    <!-- 대단원마다 <h2> + <nav class="apps"> 한 묶음을 복사해 늘린다 -->
    <h2>Ⅱ. 데이터</h2>
    <nav class="apps" aria-label="데이터 단원 앱">
      <a class="app" href="02-data/01-digital-data/index.html">
        <!-- 물결 위에 채집점이 찍힌 모양 -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M2 20 C6 8, 11 8, 15 15 S24 22, 28 10"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="6.5" cy="12.4" r="2.4" fill="currentColor"/>
          <circle cx="15" cy="15" r="2.4" fill="currentColor"/>
          <circle cx="24" cy="14.6" r="2.4" fill="currentColor"/>
        </svg>
        <span class="unit">디지털 형태의 데이터</span>
        <span class="name">점 몇 개면 될까?</span>
      </a>
      <a class="app" href="02-data/02-representation/index.html">
        <!-- 비트 격자 모양 — 일부만 켜져 있음 -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <rect x="3"  y="3"  width="10" height="10" rx="2" fill="currentColor"/>
          <rect x="17" y="3"  width="10" height="10" rx="2"
                stroke="currentColor" stroke-width="2"/>
          <rect x="3"  y="17" width="10" height="10" rx="2"
                stroke="currentColor" stroke-width="2"/>
          <rect x="17" y="17" width="10" height="10" rx="2" fill="currentColor"/>
        </svg>
        <span class="unit">다양한 데이터의 디지털 표현</span>
        <span class="name">그림일까, 글자일까, 수일까?</span>
      </a>
    </nav>

    <h2>Ⅲ. 알고리즘과 프로그래밍</h2>
    <nav class="apps" aria-label="알고리즘과 프로그래밍 단원 앱">
      <a class="app" href="03-algorithm-programming/01-problem-state/index.html">
        <!-- 두 기슭 사이 물결과 배 — 단원명에 '상태' 같은 용어를 쓰지 않는다
             (발견 전에 이름을 주지 않는 원칙, 단원 CLAUDE.md 참고) -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <rect x="2"  y="4" width="7" height="22" rx="2"
                stroke="currentColor" stroke-width="2"/>
          <rect x="21" y="4" width="7" height="22" rx="2"
                stroke="currentColor" stroke-width="2"/>
          <path d="M12 10 q1.5 -1.6 3 0 q1.5 1.6 3 0"
                stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M11.5 17 h7 l-1.7 4 h-3.6 Z" fill="currentColor"/>
        </svg>
        <span class="unit">강 건너기</span>
        <span class="name">다음에 이어서 하려면 무엇을 적어야 할까?</span>
      </a>
      <a class="app" href="03-algorithm-programming/02-abstraction/index.html">
        <!-- 채워진 세모와 빈 동그라미를 맞바꾸는 화살표 — 겉모습을 바꿔 보는 앱.
             단원명에 '추상화'를 쓰지 않는다(용어는 2차시에 처음 등장) -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M8 4.5 l4.8 8 h-9.6 Z" fill="currentColor"/>
          <circle cx="21.5" cy="21.5" r="4.5"
                  stroke="currentColor" stroke-width="2"/>
          <path d="M17 6 a9.5 9.5 0 0 1 8.5 9 m0 0 l-2.9 -0.7 m2.9 0.7 l0.6 -2.9"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
          <path d="M13 24 a9.5 9.5 0 0 1 -8.5 -9 m0 0 l2.9 0.7 m-2.9 -0.7 l-0.6 2.9"
                stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
        <span class="unit">강 건너기</span>
        <span class="name">어디까지 바꿔도 될까?</span>
      </a>
      <a class="app" href="03-algorithm-programming/03-expression/index.html">
        <!-- 한 줄이 두 갈래로 갈라지는 길 — 같은 명령 줄이 로봇마다 다르게
             굴러가는 앱. 단원명에 '알고리즘'을 쓰지 않는다(용어는 2차시에
             처음 등장, 카드 표기는 01·02와 같은 「강 건너기」) -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <path d="M3 15 H11" stroke="currentColor" stroke-width="2.2"
                stroke-linecap="round"/>
          <path d="M11 15 C17 15, 16.5 8, 23 8"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M11 15 C17 15, 16.5 22, 23 22"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <circle cx="25.5" cy="8" r="2.4" fill="currentColor"/>
          <circle cx="25.5" cy="22" r="2.4"
                  stroke="currentColor" stroke-width="2"/>
        </svg>
        <span class="unit">강 건너기</span>
        <span class="name">누가 해도 똑같을까?</span>
      </a>
      <a class="app" href="03-algorithm-programming/04-analysis/index.html">
        <!-- 출발점에서 병원(+)까지 위아래 두 갈래 길 — 길들을 재서 견주는 앱.
             단원 표기는 「응급차 이송」(소단원명에 '알고리즘·분석·설계'가
             들어 있어 쓰지 않는다 — 단원 CLAUDE.md 참고) -->
        <svg class="icon" viewBox="0 0 30 30" fill="none" aria-hidden="true">
          <circle cx="4" cy="15" r="2.7" fill="currentColor"/>
          <path d="M6.5 13 C10 8, 16 8, 19.5 12"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M6.5 17 C10 22, 16 22, 19.5 18"
                stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M25 11 v8 M21 15 h8"
                stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>
        </svg>
        <span class="unit">응급차 이송</span>
        <span class="name">어느 길이 더 좋을까?</span>
      </a>
    </nav>
  </div>
</body>
</html>
