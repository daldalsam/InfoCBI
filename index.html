<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>정보 수업 앱</title>
<style>
  :root {
    --bg: #f7f9fc;
    --ink: #0f172a;
    --dim: #64748b;
    --accent: #2563eb;
    --card: #ffffff;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 28px 20px 48px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
  }

  .wrap { max-width: 880px; margin: 0 auto; }

  h1 {
    margin: 0 0 6px;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .hint {
    margin: 0 0 26px;
    font-size: 15px;
    color: var(--dim);
  }

  /* 대단원 제목 — 아래 카드 묶음을 가른다 */
  h2 {
    margin: 30px 0 12px;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  h2:first-of-type { margin-top: 0; }

  /* 앱 카드 목록 — 앱이 늘어나면 카드가 자동으로 줄을 바꾼다 */
  .apps {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
    gap: 14px;
  }

  .app {
    display: block;
    padding: 20px 20px 22px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    text-decoration: none;
    color: inherit;
    transition: transform .06s ease, box-shadow .06s ease;
  }
  .app:hover  { box-shadow: 0 3px 10px rgba(15, 23, 42, .14); }
  .app:active { transform: scale(.98); }
  .app:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .app .unit {
    display: block;
    margin-bottom: 8px;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
  }
  .app .name {
    display: block;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.35;
  }
  /* 아이콘은 이모지 대신 AI(코덱스)로 직접 생성한 스티커 그림을 쓴다 — 앱 안의
     그림과 같은 화풍이고, 앱에 있는 그림은 그대로 가져왔다. 이모지는 기기마다
     모양이 다르고 어떤 기기에서는 색 없는 검은 글자로 나온다.
     장식이므로 보조기기에는 읽히지 않게 alt를 비운다 */
  .app .icon {
    display: block;
    margin-bottom: 10px;
    width: 44px;
    height: 44px;
  }
</style>
</head>
<body>
