<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그림일까, 글자일까, 수일까?</title>
<style>
  :root {
    --bg: #f7f9fc;
    --ink: #0f172a;
    --dim: #64748b;
    --accent: #2563eb;
    --card: #ffffff;
    --line: #e2e8f0;
    --off: #f1f5f9;        /* 꺼진 비트 칸 */
    --on: #1e3a8a;         /* 켜진 비트 칸 테두리 */
    --on-fill: #2563eb;    /* 켜진 비트 칸 몸통 — 흰 「1」과 5.2:1 */
    /* 칸 크기 — 좁은 화면에서는 줄어든다 */
    --cell: min(46px, calc((100vw - 170px) / 8));
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px 18px 28px;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
  }

  h1 {
    margin: 0 0 2px;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }
  .hint { margin: 0 0 16px; font-size: 14px; color: var(--dim); }

  /* 격자 + 글자 + 수 — 행 높이가 같아서 저절로 줄이 맞는다 */
  .board {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    flex-wrap: wrap;
  }

  /* 열 제목 — 그림(AI로 그린 스티커)을 글자 <위에> 둔다. 네 열 모두 같은
     크기의 그림을 달아야 제목 높이가 같아져 행 줄맞춤이 유지된다. 그림을
     글자 옆에 두면 좁은 화면에서 제목이 열보다 넓어져 줄맞춤이 깨진다. */
  .block .label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    font-size: 13px;
    font-weight: 600;
    color: var(--dim);
    margin-bottom: 6px;
    text-align: center;
  }
  .block .label img { width: 26px; height: 26px; }

  .bits {
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-auto-rows: var(--cell);
    gap: 3px;
    touch-action: none;      /* 나중에 드래그로 그릴 때 화면이 밀리지 않게 */
  }
  .bits button {
    border: 1px solid var(--line);
    border-radius: calc(var(--cell) * 0.22);
    background: var(--off);
    /* 꺼진 칸의 0 — 배경(--off) 대비 약 4.6:1. 학생이 읽을 글자다 */
    color: #5b6b80;
    font-size: max(10px, calc(var(--cell) * 0.28));
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  /* 켜진 칸은 스티커처럼 — 밝은 몸통 ＋ 진한 테두리(Ⅳ-1 앱들과 같은 꾸밈).
     다른 앱의 흰 빛 점은 넣지 않는다 — 「1」 글자 옆에 붙어 거슬린다(사용자 판단). */
  .bits button.on {
    background: var(--on-fill);
    border: 2px solid var(--on);
    color: #fff;
    font-weight: 700;
  }
  .bits button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  .col {
    display: grid;
    grid-auto-rows: var(--cell);
    align-items: center;
    row-gap: 3px;
  }
  .col .v {
    text-align: center;
    font-family: "SF Mono", "Menlo", "Consolas", monospace;
    background: var(--card);
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
    min-width: 44px;
    line-height: var(--cell);
  }
  .chars .v { font-size: calc(var(--cell) * 0.55); }
  .nums  .v { font-size: calc(var(--cell) * 0.42); color: var(--dim); min-width: 52px; }
  /* 빈칸 표시 ▯ — 도입의 "깨진 글자"와 잇는 관찰거리라 보여야 한다.
     글자가 있는 칸보다는 흐리되, 읽을 수는 있는 정도(약 3.1:1) */
  .chars .v.blank { color: #9aa7b8; }

  /* 그림으로 보면 — 격자선 없이 순수한 픽셀만 */
  .pic canvas {
    width: calc(var(--cell) * 3.6);
    height: calc(var(--cell) * 3.6);
    image-rendering: pixelated;
    background: #fff;
    /* 흰 테두리 여백(padding)만 둥글게 — 여백과 둥근 정도를 같게(10px) 두면
       안쪽 픽셀 영역의 모서리는 직각으로 남는다. 모서리 픽셀이 깎여 보이면
       「픽셀은 네모 칸」이라는 관찰이 흐려진다. */
    box-sizing: content-box;
    padding: 10px;
    border-radius: 10px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .1);
    display: block;
  }

  /* 극단값으로 한 번에 가는 버튼 */
  .extremes {
    margin-top: 10px;
    display: flex;
    gap: 8px;
  }
  .extremes button {
    flex: 1;
    height: 44px;
    border: 1px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(15, 23, 42, .07);
    background: var(--card);
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .extremes button:active { background: var(--off); }

  /* 좁은 화면 — 여백을 줄이고, 글자·수 열이 격자 옆에 남을 만큼만
     칸을 키운다. (여백 24 + 열 78 + 열 사이 20 + 격자 틈 21 = 143 예약,
     여유 7을 더해 150)

     분기점이 600px인 이유: 제목이 긴 넓은 화면에서는 격자+글자+수가 한 줄에
     들어가려면 573px가 필요하다. 그보다 좁으면 「수로 보면」이 아래로 떨어져
     행 줄맞춤(이 앱의 핵심 배치)이 깨진다. 폰 가로와 크롬북 분할 화면이
     이 구간이라 반드시 좁은 화면 규칙으로 넘겨야 한다.
     min()으로 46px 상한을 두는 것도 필수 — 없으면 599px에서 칸이 56px까지
     커졌다가 601px에서 46px로 뚝 떨어진다. */
  @media (max-width: 600px) {
    body { padding: 12px 12px 20px; }
    :root { --cell: min(46px, calc((100vw - 150px) / 8)); }
    .board { gap: 10px; }
    .col .v  { min-width: 36px; }
    .nums .v { min-width: 42px; }
    .block .label img { width: 22px; height: 22px; }
    /* 열 제목이 열보다 넓으면 그만큼 자리를 차지하므로 짧게 줄인다 */
    .label .full { display: none; }
  }
</style>
</head>
<body>

  <h1>그림일까, 글자일까, 수일까?</h1>
  <p class="hint">칸을 눌러 켜고 꺼 보세요.</p>

  <div class="board">

    <div class="block">
      <div class="label"><img data-icon="bit" alt=""><span>64개의 비트</span></div>
      <div class="bits" id="bits"></div>
      <div class="extremes">
        <button type="button" id="all0">모두 0</button>
        <button type="button" id="all1">모두 1</button>
      </div>
    </div>

    <div class="block">
      <div class="label"><img data-icon="char" alt=""><span>글자<span class="full">로 보면</span></span></div>
      <div class="col chars" id="chars" aria-live="polite" aria-label="글자로 보면"></div>
    </div>

    <div class="block">
      <div class="label"><img data-icon="num" alt=""><span>수<span class="full">로 보면</span></span></div>
      <div class="col nums" id="nums" aria-live="polite" aria-label="수로 보면"></div>
    </div>

    <div class="block pic">
      <div class="label"><img data-icon="pic" alt=""><span>그림으로 보면</span></div>
      <canvas id="pic" width="8" height="8" role="img"
              aria-label="같은 비트를 그림으로 그린 것 — 켜진 칸이 검은 픽셀"></canvas>
    </div>

  </div>

    pic: 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAGAAAABgCAMAAADVRocKAAAAkFBMVEULKmCWnLESc+AHPYX91zkdkP6cnrdNWnILW7Z3eHzY2+MjM2R+fv1lbI4uSmv94EOyt8dfbIzv8fc2RGaprsddaos3Rm55hJ/PuUXRtzklN1wfHz9KWHuqm0C+w9CbjDtkYjw2QD5zgZ9VqqqDeke4wdtUXocAAP8AAAAYhv0BGEj9/f0AET0ACzkHQo0UKFarnIRJAAAAMHRSTlP9//////8w4P8H/ykCMy7///wO+yxjnP///7AEoP//////XQP/HZEBAP/+//7+//5VSNfWAAAFL0lEQVR42u2ZaZurKgyAI61jpZ2p2nW2s9xzF2VU/v+/uyQo4FJrrf02eZ5ZlDYvJAFCgPTBAt+Ab8CcgI2SMAzxJ9xUElZin7qv6/9DI5ukC3h+n7fj72EDQE/J/mkm2bdHoPQ/HUGJtNJ4kK3GKwKw+3efpv/VgD9pcpRiZpEfCRlGATbpM4h8bkAu3jZ6BGG6B/uaxHlCMv5uS/eN+aZR8JYQ4CU5VvpgNhEFWemoeg/r9KDtv2LZfLKiocindKMAb2gF4ahnF1GMsYFuYFvV7DPq9Ee6hjSRaDKWjRkAYyM/wbIVagX0wTNaCLLZBSMHEnSyAuRlbbuyJQsl9MuIeqLXVeOi/lQtlS/9BQL2FaAoteFAB6oTzBR2bnhTs4nVutUNX8lqAHq5MQJoTMVpExh/SBkC9AjwfemjfbAzxZ2Cw1lVAGsiDVioVvDuFLRCaQBootAFFN7XneIVUiw6gJwA5SwAtXD2AfBVKW4FcB5FnD8M4MVSxYSQgdcwUaXNAF6sifJbABGYqAaIhgAYm7cDPOy7jX9vFOAGJ1M4gtgFwS7H2AfP8cEMgB+0Pvx6XW63y9cAJ3ARzQrA/svPpZbtGdcwyWcEeGiV83ZpCNIEYA/AhuloQFAICLYGsFz+VMSdcfKiM4IbAVyqVfl16YrqpbbRLFHE1Td+N/Qvfyk/Rw0AdAGjF7tIaQsa+rd/C6m/2wDIRwIWdwCUiUTLREHHRD2AW5ws8vO25WTBO2E6egTcO3nuqhzkykYu4FNli7uvqSbiAaat8tR0gvi0+l+FnWi3A5RBJFqgiO27HU7ln2olotn2qpLDAr6+pvmAyzovcgic0qHgjIRzQI3RVYDfux9waXMwp5VWIzWTgkBvO6apsVRIu1RcAuj+A2OUkINDkICOwG1NtjccC3i+BuBQYIKW+b5PBGH3Rh6LQqeNhQj41zQABzpH6GSzJIITrT9ikCoVhThqbfoXAN09mWsr1IeCRW73FZO3tLKWlpMRsL4I4JDLxtEBFAF2V/eiHkBvVkH2V/r91qEiuApYjALwnbW/OSDRaShurCGnaNoIlH7cpVqHMjzbSUvwpIrTAqJxPvDdmcx34Pq3QTCfivVsy13DDjrZApR+0e2/OZ/qj8VgUrvoVgDpF72H1lVRaTyh/rw6yPFRJoIaEBQX9VM/1Fe9mPpQMkZ/zfQYNYJKv3/hBFzqjNqkO/Qf8OuAej8IYKD/9Xd1fYPcQhOwqAj9AHNGw+UyIN8NFg1Ah8/Kr0MLCUE3dXQAmRnBoP3rYKUYW/nN4I01QPaayByh4uv9r+ou3Ql4GgbQeqwje0Tlxfe7ExAN3L8WWcBY/R2eLkF5F6PIhF9dCZhI4ATw69y0sx+Y2LsdQPtRIXF9GpgHTuxNKEEVlYmHAPl0/VlWZ1ADAFP6miTsygjQB8y/n3B5sRP3AvRuUdmjP0xXPs4gZxb5mHTZZ/OvryVrNPlE6AX49UQDU1ykcqKpPtalxVKXG3tqk/pjqG3Rv5pW48vvLLrXNcyerMIG8p3CDCCsC1JQrcKdGqkpk/b3t3UZkOtUPGscY+n2QOqCc8ZWdwvTqsjeEkvLSbW5suHS+pTStTimL3h/MH0JvSy0cMqDKu8naghk <script>
(function () {
  const N = 8;                          // 8×8 격자
  const bits = new Uint8Array(N * N);   // 0 또는 1이 64개. 이것이 전부다.

  const bitsEl  = document.getElementById('bits');
  const charsEl = document.getElementById('chars');
  const numsEl  = document.getElementById('nums');
  const picEl   = document.getElementById('pic');
  const pic     = picEl.getContext('2d');

  // 64개의 칸(버튼)과 행마다 글자 칸·수 칸을 만든다
  const cellBtns = [];
  for (let i = 0; i < N * N; i++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.dataset.i = i;
    // 스크린리더가 어느 칸인지 말해줄 수 있게 행·열 이름을 붙인다
    b.setAttribute('aria-label',
      (Math.floor(i / N) + 1) + '행 ' + (i % N + 1) + '열');
    // 키보드는 keydown으로만, 마우스·터치는 아래 드래그 그리기로만 처리한다.
    // click은 아무도 듣지 않는다 — 두 경로가 같은 click을 함께 처리하면
    // 한 번 눌렀는데 두 번 뒤집혀 제자리가 되기 때문.
    // (click에서 e.detail로 키보드를 가려내는 방법은 쓰지 않는다. 터치 탭에도
    //  detail을 0으로 주는 브라우저가 있어 그 기기에서는 탭이 안 먹는다.)
    b.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      e.preventDefault();        // 브라우저가 click을 만들지 않게
      bits[i] ^= 1;
      render();
    });
    bitsEl.appendChild(b);
    cellBtns.push(b);
  }

  // 드래그로 그리기 — 처음 누른 칸을 뒤집고, 끌고 지나가는 칸들을
  // 같은 값으로 칠한다. 이니셜이나 그림을 그릴 때 칸을 하나하나
  // 누르지 않아도 되게 한다.
  let painting = false;
  let paint = 1;                 // 끌고 갈 때 칠할 값
  let lastX = 0, lastY = 0;      // 직전 위치 — 빠른 드래그가 건너뛴 칸을 메운다
  let activeId = null;           // 그리는 중인 손가락(포인터) 하나만 따라간다
  function cellAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.dataset && el.dataset.i !== undefined ? Number(el.dataset.i) : null;
  }
  bitsEl.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;  // 오른쪽·가운데 버튼은 그리기가 아니다
    if (painting) return;        // 두 번째 손가락(손바닥·엄지)은 무시한다.
                                 // 안 그러면 두 손가락 사이가 줄무늬로 칠해진다
    const i = cellAt(e.clientX, e.clientY);
    if (i === null) return;
    painting = true;
    activeId = e.pointerId;
    // 포인터를 격자에 붙잡아 두면 격자 밖으로 나가도 이동·놓기 신호가
    // 계속 온다. 밖에 있는 동안은 lastX/lastY만 갱신되고 칠해지지는
    // 않아서, 다시 들어올 때 나간 지점과 직선으로 이어지는 오류가 없다.
    // 실패해도 그리기는 계속한다 — 여기서 예외가 나면 아래 코드가
    // 통째로 건너뛰어져 painting이 true로 굳고 격자가 먹통이 된다
    try { bitsEl.setPointerCapture(e.pointerId); } catch (_) {}
    paint = bits[i] ^ 1;         // 누른 칸은 뒤집고, 그 값으로 계속 칠한다
    bits[i] = paint;
    lastX = e.clientX;
    lastY = e.clientY;
    cellBtns[i].focus({ preventScroll: true });
    render();
    e.preventDefault();
  });
  bitsEl.addEventListener('pointermove', (e) => {
    if (!painting || e.pointerId !== activeId) return;
    // 드래그가 빠르면 이벤트가 띄엄띄엄 오므로, 직전 위치에서
    // 현재 위치까지 반 칸 간격으로 짚어가며 지나간 칸을 전부 칠한다
    const stepPx = bitsEl.clientWidth / N / 2;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    const steps = Math.max(1, Math.ceil(Math.hypot(dx, dy) / stepPx));
    let changed = false;
    for (let s = 1; s <= steps; s++) {
      const i = cellAt(lastX + dx * s / steps, lastY + dy * s / steps);
      if (i !== null && bits[i] !== paint) { bits[i] = paint; changed = true; }
    }
    lastX = e.clientX;
    lastY = e.clientY;
    if (changed) render();
  });
  // 그리던 손가락을 뗐을 때만 끝낸다 — 다른 손가락을 떼도 계속 그려진다
  function stopPainting(e) {
    if (e.pointerId === activeId) { painting = false; activeId = null; }
  }
  window.addEventListener('pointerup',     stopPainting);
  window.addEventListener('pointercancel', stopPainting);
  // 격자 위에서는 오른쪽 클릭 메뉴를 열지 않는다 (크롬북 두 손가락 탭)
  bitsEl.addEventListener('contextmenu', (e) => e.preventDefault());

  // 극단값 — 모두 0 / 모두 1
  document.getElementById('all0').addEventListener('click', () => { bits.fill(0); render(); });
  document.getElementById('all1').addEventListener('click', () => { bits.fill(1); render(); });
  const charCells = [], numCells = [];
  for (let r = 0; r < N; r++) {
    const c = document.createElement('div');
    c.className = 'v';
    charsEl.appendChild(c);
    charCells.push(c);
    const n = document.createElement('div');
    n.className = 'v';
    numsEl.appendChild(n);
    numCells.push(n);
  }

  // 한 행(8비트)을 왼쪽이 큰 자리(128)인 이진수로 읽는다
  function rowValue(r) {
    let v = 0;
    for (let c = 0; c < N; c++) v = v * 2 + bits[r * N + c];
    return v;
  }

  // 직전에 화면에 넣은 값. 바뀐 것만 다시 넣기 위해 기억해 둔다.
  // 글자·수 열은 aria-live 영역이라, 안 바뀐 칸까지 다시 넣으면
  // 보조기기가 16줄을 통째로 다시 읽는다(드래그 중에는 초당 수십 번).
  const shown = { bits: new Int8Array(N * N).fill(-1), chars: [], nums: [] };

  function render() {
    // 비트 칸 — 켜짐/꺼짐과 1/0 표시
    for (let i = 0; i < N * N; i++) {
      if (shown.bits[i] === bits[i]) continue;
      shown.bits[i] = bits[i];
      cellBtns[i].className = bits[i] ? 'on' : '';
      cellBtns[i].textContent = bits[i] ? '1' : '0';
      cellBtns[i].setAttribute('aria-pressed', bits[i] ? 'true' : 'false');
    }

    // 행마다: 같은 8비트를 글자로도, 수로도 읽는다
    for (let r = 0; r < N; r++) {
      const v = rowValue(r);
      // 문자 코드에 보이는 글자가 있는 값(33~126)만 글자로 나온다.
      // 나머지는 ▯ — 깨진 글자처럼 보이는 것도 관찰거리다.
      const ch = (v >= 33 && v <= 126) ? String.fromCharCode(v) : '▯';
      if (shown.chars[r] !== ch) {
        shown.chars[r] = ch;
        charCells[r].textContent = ch;
        charCells[r].classList.toggle('blank', ch === '▯');
      }
      if (shown.nums[r] !== v) {
        shown.nums[r] = v;
        numCells[r].textContent = v;
      }
    }

    // 그림 — 같은 비트를 픽셀로. 켜짐 = 검정
    pic.fillStyle = '#ffffff';
    pic.fillRect(0, 0, N, N);
    pic.fillStyle = '#0f172a';
    let on = 0;
    for (let i = 0; i < N * N; i++) {
      if (bits[i]) { pic.fillRect(i % N, Math.floor(i / N), 1, 1); on++; }
    }
    // 그림은 캔버스라 보조기기가 내용을 볼 수 없다. 몇 칸이 검은지라도
    // 알려준다 — 고정 문구로 두면 조작해도 설명이 그대로다
    picEl.setAttribute('aria-label',
      '같은 비트를 그림으로 그린 것 — 64칸 중 ' + on + '칸이 검은 픽셀');
  }

  render();
})();
</script>
