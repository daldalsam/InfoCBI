<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>어느 길이 더 좋을까?</title>
<style>
:root {
  --내길: #1d4ed8;
  --가까운차: #047857;
  --빠른차: #6d28d9;
  --막힘: #dc2626;
  --길: #94a3b8;
  --먹: #0f172a;
  --회: #64748b;
  --테두리: #cbd5e1;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  color: var(--먹);
  background: #f8fafc;
}
button { font-family: inherit; cursor: pointer; }

/* ── 머리 ── */
.머리 {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding: 10px 12px 6px;
}
.머리 h1 { font-size: 17px; margin: 0; font-weight: 700; }
.시간대선택 { display: flex; gap: 6px; margin-left: auto; }
.시간대단추 {
  min-height: 44px; padding: 6px 14px;
  font-size: 16px; border-radius: 12px;
  border: 2px solid var(--테두리); background: #fff; color: var(--먹);
}
.시간대단추[aria-pressed="true"] {
  border-color: var(--먹); background: var(--먹); color: #fff; font-weight: 700;
}

/* ── 판 배치 ── */
.판 {
  display: grid; gap: 10px; padding: 0 12px 16px;
  grid-template-areas: '기록' '지도' '단추';
}
@media (min-width: 900px) {
  .판 {
    grid-template-columns: minmax(0, 1fr) 330px;
    grid-template-areas: '지도 기록' '지도 단추';
    align-items: start;
  }
}
.지도쪽 { grid-area: 지도; min-width: 0; }
.기록쪽 { grid-area: 기록; position: sticky; top: 0; z-index: 5; background: #f8fafc; padding: 6px 0; }
@media (min-width: 900px) { .기록쪽 { position: static; padding: 0; } }
.단추쪽 { grid-area: 단추; display: flex; flex-wrap: wrap; gap: 8px; }

/* ── 지도 ── */
#지도칸 svg {
  width: 100%; height: auto; display: block;
  background: #fff; border: 1px solid #e2e8f0; border-radius: 14px;
  transition: background-color .3s;
}
body[data-시간대="새벽"] #지도칸 svg { background: #eef2ff; }
body[data-시간대="퇴근길"] #지도칸 svg { background: #fff7ed; }

.길선 { stroke: var(--길); stroke-width: 11; fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.길선.막힘 { stroke: var(--막힘); opacity: .8; }

/* 이을 수 있는 구간의 표시(모든 후보에 똑같이) · 초점 표시 */
.후보테, .초점테 {
  fill: none; stroke-linecap: round; stroke-linejoin: round;
  opacity: 0; pointer-events: none; transition: opacity .15s;
}
.후보테 { stroke: #93c5fd; stroke-width: 27; }
.후보테.보임 { opacity: .65; }
.초점테 { stroke: #1d4ed8; stroke-width: 21; }
.초점테.보임 { opacity: .4; }

/* 내 길·차들의 선 */
.내길선, .차선 { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.내길선 { stroke: var(--내길); stroke-width: 13; }
.차선 { stroke-width: 7; }
.차선.가까운차선 { stroke: var(--가까운차); stroke-dasharray: 15 11; }
.차선.빠른차선 { stroke: var(--빠른차); stroke-dasharray: 2 10; }
.여기테 { fill: none; stroke: var(--내길); stroke-width: 4; stroke-dasharray: 7 7; pointer-events: none; }

/* 탭·초점을 받는 투명한 선 */
.잡기 { stroke: transparent; stroke-width: 52; fill: none; pointer-events: stroke; }
.잡기.이을수있음 { cursor: pointer; }
.잡기:focus { outline: none; }
.값무리.이을수있음 { cursor: pointer; }

.값상자 { fill: #fff; stroke: var(--테두리); stroke-width: 2; }
.막힘 .값상자 { stroke: var(--막힘); }
.값이름 { font-size: 20px; fill: var(--회); text-anchor: middle; pointer-events: none; }
.값글 { font-size: 28px; font-weight: 700; fill: var(--먹); text-anchor: middle; pointer-events: none; }
.값글 .분값.막힘글 { fill: var(--막힘); }
.반짝 .값상자 { animation: 반짝임 .8s ease-out; }
.반짝칸 { animation: 반짝임 .8s ease-out; }
@keyframes 반짝임 { from { fill: #fde68a; background-color: #fde68a; } }
@media (prefers-reduced-motion: reduce) {
  .반짝 .값상자, .반짝칸 { animation: none; }
}

.장소원 { fill: #fff; stroke: #475569; stroke-width: 3.5; }
.장소원.출발 { fill: #b91c1c; stroke: #7f1d1d; }
.장소이름 { font-size: 24px; font-weight: 600; fill: var(--먹); text-anchor: middle; pointer-events: none; }
.장소그림 { font-size: 30px; text-anchor: middle; pointer-events: none; }

/* ── 도착 기록 ── */
.지금시간대 {
  display: inline-block; font-size: 20px; padding: 6px 14px; margin-bottom: 6px;
  border-radius: 999px; background: #fef3c7; border: 1.5px solid #d6b24c;
}
body[data-시간대="새벽"] .지금시간대 { background: #e0e7ff; border-color: #818cf8; }
body[data-시간대="퇴근길"] .지금시간대 { background: #ffedd5; border-color: #fb923c; }
.지금시간대 b { font-size: 24px; }

.도착기록 {
  width: 100%; border-collapse: collapse; background: #fff;
  border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden;
}
.도착기록 th, .도착기록 td { padding: 9px 10px; text-align: left; }
.도착기록 thead th {
  font-size: 13px; color: var(--회); font-weight: 600;
  border-bottom: 1px solid #e2e8f0; text-align: right;
}
.도착기록 thead th:first-child { text-align: left; }
.도착기록 tbody th { font-size: 15px; font-weight: 600; white-space: nowrap; }
.도착기록 tbody td {
  font-size: 21px; font-weight: 700; text-align: right;
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.도착기록 tbody tr + tr { border-top: 1px solid #f1f5f9; }
.도착기록 .상태말 { display: block; margin-left: 29px; font-size: 13px; font-weight: 600; color: var(--회); }
.색표 {
  display: inline-block; width: 22px; height: 0; margin-right: 7px;
  vertical-align: middle; border-top: 5px solid; border-radius: 3px;
}
.색표.내길색 { border-color: var(--내길); }
.색표.가까운색 { border-color: var(--가까운차); border-top-style: dashed; }
.색표.빠른색 { border-color: var(--빠른차); border-top-style: dotted; }

/* ── 단추 ── */
.차단추 {
  flex: 1 1 210px; min-height: 56px; padding: 8px 12px;
  font-size: 16px; font-weight: 700; color: #fff;
  border: none; border-radius: 12px;
}
#가까운차단추 { background: var(--가까운차); }
#빠른차단추 { background: var(--빠른차); }
.보통단추 {
  flex: 1 1 130px; min-height: 48px; padding: 6px 12px;
  font-size: 15px; font-weight: 600;
  background: #fff; border: 2px solid var(--테두리); border-radius: 12px;
}

/* ── 상태줄 ── */
.상태줄 {
  min-height: 22px; margin: 6px 2px 0;
  font-size: 15px; color: var(--회);
}
</style>
</head>
<body data-시간대="낮">

<header class="머리">
  <h1>어느 길이 더 좋을까?</h1>
  <div class="시간대선택" role="group" aria-label="시간대 고르기">
    <button class="시간대단추" data-시간대="새벽" aria-pressed="false">🌙 새벽</button>
    <button class="시간대단추" data-시간대="낮" aria-pressed="true">☀️ 낮</button>
    <button class="시간대단추" data-시간대="퇴근길" aria-pressed="false">🌆 퇴근길</button>
  </div>
</header>

<main class="판">
  <section class="지도쪽">
    <div id="지도칸"></div>
    <p id="상태줄" class="상태줄" aria-live="polite"></p>
  </section>

  <aside class="기록쪽">
    <div class="지금시간대">지금은 <b id="시간대큰글">낮</b></div>
    <table class="도착기록">
      <thead>
        <tr><th scope="col">도착 기록</th><th scope="col">km</th><th scope="col">분</th></tr>
      </thead>
      <tbody>
        <tr>
          <th scope="row"><span class="색표 내길색"></span>내 길<span class="상태말" id="내길상태">아직 가는 중</span></th>
          <td id="내길km">—</td><td id="내길분">—</td>
        </tr>
        <tr>
          <th scope="row"><span class="색표 가까운색"></span>가까운길차</th>
          <td id="가까운km">—</td><td id="가까운분">—</td>
        </tr>
        <tr>
          <th scope="row"><span class="색표 빠른색"></span>빠른길차</th>
          <td id="빠른km">—</td><td id="빠른분">—</td>
        </tr>
      </tbody>
    </table>
  </aside>

  <div class="단추쪽">
    <button id="가까운차단추" class="차단추">가까운 길만 따라가는 차</button>
    <button id="빠른차단추" class="차단추">빠른 길만 따라가는 차</button>
    <button id="되돌리기단추" class="보통단추">↩ 한 구간 되돌리기</button>
  </div>
</main>

<script>
// [엔진 시작] — 화면 없는 계산부. 검수 하네스가 이 구간을 그대로 읽어
// 노드(node)에서 실행하므로, 여기서는 document·window 같은
// 브라우저 전용 이름을 쓰지 않는다.

// ── 지도 데이터 ─────────────────────────────────────────────────────
// lesson.md 5번 「예시 지도」의 확정 수치.
// 수치를 하나라도 바꾸면 「데이터가 지켜야 할 관계」 1~7을
// 검수 하네스로 전부 다시 확인할 것.
const 시간대들 = ['새벽', '낮', '퇴근길'];

const 지점들 = ['사고 지점', '시장 사거리', '큰길 입구', '굴다리 앞', '강변 삼거리', '병원'];
const 시작 = '사고 지점';
const 목표 = '병원';

// 구간은 한 방향(가→나)이다 — 사고 지점(왼쪽)에서 병원(오른쪽)으로만
// 진행하는 지도라, 같은 곳을 두 번 지나는 경로가 생기지 않는다.
const 구간들 = [
  { 이름: '시장길',        가: '사고 지점',   나: '시장 사거리', km: 1,   분: { 낮: 7, 퇴근길: 7,  새벽: 2 } },
  { 이름: '큰길',          가: '사고 지점',   나: '큰길 입구',   km: 2,   분: { 낮: 4, 퇴근길: 12, 새벽: 4 } },
  { 이름: '시장윗길',      가: '시장 사거리', 나: '병원',        km: 2,   분: { 낮: 8, 퇴근길: 8,  새벽: 4 } },
  { 이름: '굴다리',        가: '큰길 입구',   나: '굴다리 앞',   km: 0.5, 분: { 낮: 1, 퇴근길: 1,  새벽: 1 } },
  { 이름: '반대편 우회로', 가: '굴다리 앞',   나: '병원',        km: 3.5, 분: { 낮: 9, 퇴근길: 9,  새벽: 7 } },
  { 이름: '강변길',        가: '큰길 입구',   나: '강변 삼거리', km: 1.5, 분: { 낮: 3, 퇴근길: 6,  새벽: 3 } },
  { 이름: '병원앞길',      가: '강변 삼거리', 나: '병원',        km: 1.5, 분: { 낮: 3, 퇴근길: 6,  새벽: 3 } },
];

// 안 막힌 길의 빠르기가 1km=2분(새벽이 그 기준). 그보다 오래 걸리면 막히는 구간.
function 막히는가(구간, 시간대) {
  return 구간.분[시간대] > 구간.km * 2;
}

// ── 지도 만들기 ─────────────────────────────────────────────────────
// 시간대 하나를 골라 '어느 지점에서 어디로 갈 수 있는지'(이웃)를 계산한다.
// 시간대를 바꾸면 이 함수로 지도를 새로 만든다.
function 지도만들기(시간대) {
  const 이웃 = {};
  for (const 이름 of 지점들) 이웃[이름] = [];
  for (const 구간 of 구간들) {
    이웃[구간.가].push({ 곳: 구간.나, 거리: 구간.km, 시간: 구간.분[시간대], 구간 });
  }
  // 탐욕이 동점을 만나면 목록의 앞엣것을 고른다. 입력 순서가 아니라
  // 이름순으로 정렬해 두어야 같은 지도에서 언제나 같은 결과가 나온다.
  for (const 이름 of 지점들) 이웃[이름].sort((a, b) => a.곳.localeCompare(b.곳, 'ko'));
  return { 시간대, 시작, 목표, 이웃 };
}

// ── 탐욕 실행기 ─────────────────────────────────────────────────────
// 갈림길마다 기준('거리'|'시간') 값이 가장 작은 구간을 골라 나아간다.
// 「가까운 길만 따라가는 차」= 기준 '거리', 「빠른 길만 따라가는 차」= 기준 '시간'.
function 탐욕실행(지도, 기준) {
  let 현재 = 지도.시작;
  const 경로 = [현재];
  let 거리 = 0, 시간 = 0;
  while (현재 !== 지도.목표) {
    if (경로.length > 지점들.length) return { 끝남: '너무많음', 경로, 거리, 시간 };
    const 후보 = 지도.이웃[현재];
    if (후보.length === 0) return { 끝남: '막힘', 경로, 거리, 시간 };
    const 최소값 = Math.min(...후보.map((e) => e[기준]));
    const 고른것 = 후보.find((e) => e[기준] === 최소값);
    경로.push(고른것.곳);
    거리 += 고른것.거리;
    시간 += 고른것.시간;
    현재 = 고른것.곳;
  }
  return { 끝남: '도착', 경로, 거리, 시간 };
}

// ── 모든 경로 나열 ── ※ 검수 하네스 전용 ───────────────────────────
// 화면 코드에서 부르지 않는다. 최적해(가장 좋은 값·경로)를 학생에게
// 보여주지 않는 것이 이 앱의 설계다(lesson.md 5번 「앱이 하지 않을 것」).
function 모든경로(지도) {
  const 모음 = [];
  (function 파고들기(현재, 경로, 거리, 시간) {
    if (현재 === 지도.목표) { 모음.push({ 경로: [...경로], 거리, 시간 }); return; }
    for (const e of 지도.이웃[현재]) {
      경로.push(e.곳);
      파고들기(e.곳, 경로, 거리 + e.거리, 시간 + e.시간);
      경로.pop();
    }
  })(지도.시작, [지도.시작], 0, 0);
  모음.sort((a, b) => a.시간 - b.시간 || a.거리 - b.거리);
  return 모음;
}

// ── 갈림길 찾기 ── ※ 검수 하네스 전용 ─────────────────────────────
// 탐욕이 어디에서 최선을 처음 놓쳤는지 계산한다. 지나온 앞부분으로 시작하는
// 완주 경로들의 최선값은 한 걸음마다 그대로이거나 나빠진다 — 처음 나빠진
// 순간이 최선을 버린 갈림길이다. 화면 코드에서 부르지 않는다(위와 같은 이유).
function 갈림길찾기(지도, 결과, 기준) {
  if (결과.끝남 !== '도착') return null;
  const 전부 = 모든경로(지도);
  const 앞부분같음 = (경로, 접두) => 접두.every((곳, i) => 경로[i] === 곳);
  const 남은최선 = (접두) => {
    const 것들 = 전부.filter((p) => 앞부분같음(p.경로, 접두));
    return 것들.length ? Math.min(...것들.map((p) => p[기준])) : Infinity;
  };
  const 길 = 결과.경로;
  let 앞최선 = 남은최선(길.slice(0, 1));
  for (let i = 0; i + 1 < 길.length; i++) {
    const 뒤최선 = 남은최선(길.slice(0, i + 2));
    if (뒤최선 > 앞최선) {
      const 지나온것 = 길.slice(0, i + 1);
      const 고른곳 = 길[i + 1];
      const 더나은곳 = 지도.이웃[길[i]]
        .map((e) => e.곳)
        .filter((곳) => 곳 !== 고른곳)
        .find((곳) => 남은최선([...지나온것, 곳]) === 앞최선) ?? null;
      return {
        갈림길: 길[i],
        고른곳,
        더나은곳,
        최선값: 앞최선,
        실제값: 결과[기준],
        잃은값: 뒤최선 - 앞최선,
        최선경로: 전부.find((p) => 앞부분같음(p.경로, 지나온것) && p[기준] === 앞최선)?.경로 ?? null,
      };
    }
    앞최선 = 뒤최선;
  }
  return null;  // 탐욕이 최선을 놓치지 않았다
}
// [엔진 끝]
</script>
<script>
// ── 화면 ─────────────────────────────────────────────────────────────

// SVG 요소를 만드는 짧은 도우미
function svg요소(태그, 속성 = {}, 부모 = null) {
  const 것 = document.createElementNS('http://www.w3.org/2000/svg', 태그);
  for (const [키, 값] of Object.entries(속성)) {
    if (값 === null || 값 === undefined) continue;
    것.setAttribute(키, 값);
  }
  if (부모) 부모.appendChild(것);
  return 것;
}

// 사용자가 '동작 줄이기'를 켜 두었으면 반짝임을 생략한다.
function 움직임줄이기() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// 받침에 따라 조사를 고른다. 예) 조사('병원', '으로', '로') → '으로'
// '으로/로'는 ㄹ받침이 예외다 — 퇴근길로(O), 퇴근길으로(X).
function 조사(낱말, 받침있을때, 받침없을때) {
  const 끝글자 = String(낱말).trim().slice(-1);
  const 코드 = 끝글자.charCodeAt(0);
  if (코드 < 0xac00 || 코드 > 0xd7a3) return 받침없을때;
  const 받침 = (코드 - 0xac00) % 28;
  if (받침 === 8 && 받침있을때 === '으로') return 받침없을때;
  return 받침 ? 받침있을때 : 받침없을때;
}

// ── 지도 좌표 (viewBox 1000×575 중 y 40~575) ────────────────────────
// 눈으로 볼 때 대략 km에 비례하게 — 굴다리가 제일 짧고 우회로가 제일 길게.
const 지점자리 = {
  '사고 지점':   { x: 85,  y: 255, 이름y: 48 },
  '시장 사거리': { x: 300, y: 120, 이름y: -32 },
  '큰길 입구':   { x: 390, y: 400, 이름x: -80, 이름y: 25 },
  '굴다리 앞':   { x: 525, y: 480, 이름y: 44 },
  '강변 삼거리': { x: 645, y: 295, 이름y: -28 },
  '병원':        { x: 915, y: 130, 이름y: -46 },
};
const 지점반지름 = (이름) => (이름 === 목표 ? 26 : 이름 === 시작 ? 17 : 13);
// 꺾여서 그려지는 구간 (반대편으로 돌아가는 느낌)
const 구간굽이 = { '반대편 우회로': [{ x: 810, y: 500 }] };
// 구간 이름·값 상자의 위치 (선 가운데에서 손으로 옮겨 둔 자리)
const 라벨자리 = {
  '시장길':        { x: 150, y: 168 },
  '큰길':          { x: 200, y: 352 },
  '시장윗길':      { x: 607, y: 78 },
  '굴다리':        { x: 405, y: 470 },
  '반대편 우회로': { x: 750, y: 532 },
  '강변길':        { x: 495, y: 320 },
  '병원앞길':      { x: 780, y: 250 },
};

const 화면 = {
  지도칸: document.getElementById('지도칸'),
  상태줄: document.getElementById('상태줄'),
  시간대큰글: document.getElementById('시간대큰글'),
  시간대단추들: [...document.querySelectorAll('.시간대단추')],
  내길상태: document.getElementById('내길상태'),
  기록칸: {
    내길: { km: document.getElementById('내길km'), 분: document.getElementById('내길분') },
    가까운: { km: document.getElementById('가까운km'), 분: document.getElementById('가까운분') },
    빠른: { km: document.getElementById('빠른km'), 분: document.getElementById('빠른분') },
  },
  구간그림: {},   // 이름 → { 길선, 값무리, 분값, 후보테, 초점테, 잡기 }
  내길선: null,
  차선: {},
  여기테: null,
};

// ── 조작 상태 ────────────────────────────────────────────────────────
let 현재시간대 = '낮';
let 내길 = [시작];                       // 학생이 이은 길 (지점 이름들)
let 차경로 = { 가까운: null, 빠른: null }; // 단추를 눌렀을 때 그려진 경로 그대로

function 구간찾기(가, 나) {
  return 구간들.find((g) => g.가 === 가 && g.나 === 나);
}
// 경로의 거리·시간 합. 시간대가 바뀌면 같은 경로라도 분 합이 달라진다.
function 경로값(노드들, 시간대) {
  let km = 0, 분 = 0;
  for (let i = 0; i + 1 < 노드들.length; i++) {
    const g = 구간찾기(노드들[i], 노드들[i + 1]);
    km += g.km;
    분 += g.분[시간대];
  }
  return { km, 분 };
}

// ── 그리기 도우미 ────────────────────────────────────────────────────
function 구간점들(구간) {
  return [지점자리[구간.가], ...(구간굽이[구간.이름] ?? []), 지점자리[구간.나]];
}
function 경로점들(노드들) {
  const 점 = [지점자리[노드들[0]]];
  for (let i = 0; i + 1 < 노드들.length; i++) {
    const g = 구간찾기(노드들[i], 노드들[i + 1]);
    점.push(...(구간굽이[g.이름] ?? []), 지점자리[노드들[i + 1]]);
  }
  return 점;
}
function 선d(점들) {
  return 점들.map((p, i) => `${i ? 'L' : 'M'}${p.x} ${p.y}`).join(' ');
}
// 도로에서 조금 비켜 나란히 달리는 선 — 세 경로가 같은 도로를 지나도 겹치지 않게
function 평행선d(점들, 치우침) {
  if (!치우침) return 선d(점들);
  const 옮긴 = [];
  for (let i = 0; i + 1 < 점들.length; i++) {
    const a = 점들[i], b = 점들[i + 1];
    const 길이 = Math.hypot(b.x - a.x, b.y - a.y);
    const nx = (-(b.y - a.y) / 길이) * 치우침;
    const ny = ((b.x - a.x) / 길이) * 치우침;
    옮긴.push({ x: a.x + nx, y: a.y + ny }, { x: b.x + nx, y: b.y + ny });
  }
  return 선d(옮긴);
}

function 지도그리기() {
  const svg = svg요소('svg', {
    viewBox: '0 40 1000 535',
    'aria-label': '사고 지점에서 병원까지 가는 갈림길 지도',
  }, 화면.지도칸);

  const 층 = {
    후보: svg요소('g', {}, svg),
    길: svg요소('g', {}, svg),
    경로: svg요소('g', {}, svg),
    값: svg요소('g', {}, svg),
    장소: svg요소('g', {}, svg),
    잡기: svg요소('g', {}, svg),
  };

  for (const 구간 of 구간들) {
    const d = 선d(구간점들(구간));
    const 후보테 = svg요소('path', { d, class: '후보테' }, 층.후보);
    const 초점테 = svg요소('path', { d, class: '초점테' }, 층.후보);
    const 길선 = svg요소('path', { d, class: '길선' }, 층.길);

    const 자리 = 라벨자리[구간.이름];
    const 값무리 = svg요소('g', { transform: `translate(${자리.x} ${자리.y})`, class: '값무리' }, 층.값);
    svg요소('rect', { x: -89, y: -29, width: 178, height: 58, rx: 12, class: '값상자' }, 값무리);
    svg요소('text', { y: -8, class: '값이름' }, 값무리).textContent = 구간.이름;
    const 값글 = svg요소('text', { y: 21, class: '값글' }, 값무리);
    svg요소('tspan', {}, 값글).textContent = `${구간.km}km · `;
    const 분값 = svg요소('tspan', { class: '분값' }, 값글);

    const 잡기 = svg요소('path', { d, class: '잡기', tabindex: '0', role: 'button' }, 층.잡기);
    잡기.addEventListener('click', () => 구간탭(구간));
    잡기.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); 구간탭(구간); }
    });
    잡기.addEventListener('focus', () => 초점테.classList.toggle('보임', 잡기.matches(':focus-visible')));
    잡기.addEventListener('blur', () => 초점테.classList.remove('보임'));
    값무리.addEventListener('click', () => 구간탭(구간));

    화면.구간그림[구간.이름] = { 길선, 값무리, 분값, 후보테, 초점테, 잡기 };
  }

  화면.차선.가까운 = svg요소('path', { class: '차선 가까운차선' }, 층.경로);
  화면.차선.빠른 = svg요소('path', { class: '차선 빠른차선' }, 층.경로);
  화면.내길선 = svg요소('path', { class: '내길선' }, 층.경로);

  for (const 이름 of 지점들) {
    const 점 = 지점자리[이름];
    const 무리 = svg요소('g', { transform: `translate(${점.x} ${점.y})` }, 층.장소);
    if (이름 === 시작) {
      svg요소('circle', { r: 17, class: '장소원 출발' }, 무리);
    } else if (이름 === 목표) {
      svg요소('circle', { r: 26, class: '장소원' }, 무리);
      svg요소('text', { y: 11, class: '장소그림' }, 무리).textContent = '🏥';
    } else {
      svg요소('circle', { r: 13, class: '장소원' }, 무리);
    }
    svg요소('text', { x: 점.이름x ?? 0, y: 점.이름y, class: '장소이름' }, 무리).textContent = 이름;
  }
  화면.여기테 = svg요소('circle', { class: '여기테' }, 층.장소);
}

// ── 화면 갱신 ────────────────────────────────────────────────────────
function 상태알림(글) {
  화면.상태줄.textContent = 글;
}

function 반짝이기(요소, 클래스) {
  요소.classList.remove(클래스);
  void 요소.getBoundingClientRect();
  요소.classList.add(클래스);
}

// 도착 기록의 숫자들을 다시 계산한다. 경로 자체는 여기서 건드리지 않는다.
function 기록갱신(반짝) {
  const 줄들 = [
    ['내길', 내길.length > 1 ? 내길 : null],
    ['가까운', 차경로.가까운],
    ['빠른', 차경로.빠른],
  ];
  for (const [줄, 경로] of 줄들) {
    const 칸 = 화면.기록칸[줄];
    const 새km = 경로 ? `${경로값(경로, 현재시간대).km}km` : '—';
    const 새분 = 경로 ? `${경로값(경로, 현재시간대).분}분` : '—';
    if (반짝 && !움직임줄이기() && 칸.분.textContent !== 새분 && 경로) 반짝이기(칸.분, '반짝칸');
    칸.km.textContent = 새km;
    칸.분.textContent = 새분;
  }
  화면.내길상태.textContent = 내길[내길.length - 1] === 목표 ? '병원 도착' : '아직 가는 중';
}

// 내 길의 선·현재 위치 테·이을 수 있는 구간 표시를 갱신한다.
function 내길그리기() {
  화면.내길선.setAttribute('d', 내길.length > 1 ? 평행선d(경로점들(내길), 0) : '');
  const 끝 = 내길[내길.length - 1];
  const 점 = 지점자리[끝];
  화면.여기테.setAttribute('cx', 점.x);
  화면.여기테.setAttribute('cy', 점.y);
  화면.여기테.setAttribute('r', 지점반지름(끝) + 9);
  for (const 구간 of 구간들) {
    const 그림 = 화면.구간그림[구간.이름];
    const 후보 = 끝 !== 목표 && 구간.가 === 끝;
    그림.후보테.classList.toggle('보임', 후보);
    그림.잡기.classList.toggle('이을수있음', 후보);
    그림.값무리.classList.toggle('이을수있음', 후보);
  }
  접근성라벨갱신();
}

// 구간을 읽어 주는 이름표 (키보드·보조기기용)
function 접근성라벨갱신() {
  const 끝 = 내길[내길.length - 1];
  for (const 구간 of 구간들) {
    const 후보 = 끝 !== 목표 && 구간.가 === 끝;
    화면.구간그림[구간.이름].잡기.setAttribute('aria-label',
      `${구간.이름}, ${구간.가}에서 ${구간.나} 방향, ${구간.km}km ${구간.분[현재시간대]}분`
      + (후보 ? ', 지금 이을 수 있어요' : ''));
  }
}

// 시간대에 따라 분 값·막힘 표시를 갱신한다. 이미 그려진 길은 지우지 않는다.
function 시간대반영(반짝) {
  for (const 구간 of 구간들) {
    const 그림 = 화면.구간그림[구간.이름];
    const 새분 = `${구간.분[현재시간대]}분`;
    const 바뀜 = 그림.분값.textContent !== 새분;
    그림.분값.textContent = 새분;
    const 막힘 = 막히는가(구간, 현재시간대);
    그림.길선.classList.toggle('막힘', 막힘);
    그림.값무리.classList.toggle('막힘', 막힘);
    그림.분값.classList.toggle('막힘글', 막힘);
    if (반짝 && 바뀜 && !움직임줄이기()) 반짝이기(그림.값무리, '반짝');
    else 그림.값무리.classList.remove('반짝');
  }
  document.body.dataset.시간대 = 현재시간대;
  화면.시간대큰글.textContent = 현재시간대;
  for (const 단추 of 화면.시간대단추들) {
    단추.setAttribute('aria-pressed', String(단추.dataset.시간대 === 현재시간대));
  }
  기록갱신(반짝);
  접근성라벨갱신();
}

// ── 조작 ─────────────────────────────────────────────────────────────
function 구간탭(구간) {
  const 끝 = 내길[내길.length - 1];
  if (끝 === 목표) {
    상태알림('이미 병원에 도착했어요. 길을 바꾸려면 「한 구간 되돌리기」를 눌러 주세요.');
    return;
  }
  if (구간.가 !== 끝) {
    상태알림(`지금 있는 곳은 ${끝}. 파랗게 표시된 길만 이을 수 있어요.`);
    return;
  }
  내길.push(구간.나);
  내길그리기();
  기록갱신(false);
  if (구간.나 === 목표) {
    const 값 = 경로값(내길, 현재시간대);
    상태알림(`병원에 도착했어요 — ${값.km}km · ${값.분}분.`);
  } else {
    상태알림(`${구간.이름}${조사(구간.이름, '을', '를')} 이었어요. 지금 ${구간.나}.`);
  }
}

document.getElementById('되돌리기단추').addEventListener('click', () => {
  if (내길.length < 2) { 상태알림('되돌릴 구간이 없어요.'); return; }
  내길.pop();
  내길그리기();
  기록갱신(false);
  상태알림(`한 구간 되돌렸어요. 지금 ${내길[내길.length - 1]}.`);
});

// 차 단추 — 누를 때마다 지금 시간대의 판에서 새로 계산해 그 차의 선을 갈아 끼운다
function 차달리기(종류) {
  const 결과 = 탐욕실행(지도만들기(현재시간대), 종류 === '가까운' ? '거리' : '시간');
  차경로[종류] = 결과.경로;
  화면.차선[종류].setAttribute('d', 평행선d(경로점들(결과.경로), 종류 === '가까운' ? -11 : 11));
  기록갱신(false);
  상태알림(`${종류 === '가까운' ? '가까운길차' : '빠른길차'}가 병원에 도착했어요 — ${결과.거리}km · ${결과.시간}분.`);
}
document.getElementById('가까운차단추').addEventListener('click', () => 차달리기('가까운'));
document.getElementById('빠른차단추').addEventListener('click', () => 차달리기('빠른'));

for (const 단추 of 화면.시간대단추들) {
  단추.addEventListener('click', () => {
    if (단추.dataset.시간대 === 현재시간대) return;
    현재시간대 = 단추.dataset.시간대;
    시간대반영(true);
    상태알림(`시간대를 ${현재시간대}${조사(현재시간대, '으로', '로')} 바꿨어요.`);
  });
}

// ── 시작 ─────────────────────────────────────────────────────────────
지도그리기();
내길그리기();
시간대반영(false);
상태알림('파랗게 표시된 길을 눌러, 사고 지점에서 병원까지 내 길을 이어 보세요.');
</script>
</body>
</html>
