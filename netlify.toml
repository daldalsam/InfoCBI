# 넷리파이 배포 설정
#
# GitHub 공개 저장소에는 수업 설계 문서(.md)도 함께 공개하지만,
# Netlify 웹사이트에는 수업용 HTML과 학습 자료만 배포한다.
# 배포 직전에 수업 설계·지침 문서(.md)와 도구 설정 폴더(.claude)를 지운다.
# 이 삭제는 넷리파이의 배포용 복사본에서만 일어난다.
# 저장소와 내 컴퓨터의 파일은 그대로 남는다.
#
# 확인 방법: 배포 후 https://<사이트>.netlify.app/CLAUDE.md 를 직접 열어
# "Page not found"(404)가 나오면 성공.

[build]
  publish = "."
  command = "find . -name '*.md' -delete && rm -rf .claude"
